<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123B5D"/>
      <stop offset="100%" stop-color="#176B87"/>
    </linearGradient>
    <linearGradient id="session1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF4FA"/>
      <stop offset="100%" stop-color="#F8FBFD"/>
    </linearGradient>
    <linearGradient id="session2Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF7F1"/>
      <stop offset="100%" stop-color="#F8FCFA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 20px Inter, Segoe UI, Arial, sans-serif; fill: #DDEAF2; }
      .sectionTitle { font: 700 28px Inter, Segoe UI, Arial, sans-serif; fill: #0F172A; }
      .sectionSub { font: 600 17px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .cardTitle { font: 700 19px Inter, Segoe UI, Arial, sans-serif; fill: #0F172A; }
      .body { font: 400 16px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .small { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .chip { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #0F172A; }
      .flowTitle { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; }
      .footerTitle { font: 700 23px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; }
      .footerBody { font: 400 16px Inter, Segoe UI, Arial, sans-serif; fill: #DDEAF2; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1050" fill="#F4F7FA"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="145" fill="url(#headerGrad)"/>
  <text x="80" y="62" class="title">Sistemas Distribuidos · Semana 2</text>
  <text x="80" y="99" class="subtitle">Arquitecturas distribuidas → decisión arquitectónica → ADR → backlog · Corte 1</text>
  <rect x="1332" y="40" width="188" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.14"/>
  <text x="1426" y="76" text-anchor="middle" style="font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF;">CORHUILA · 2026-B</text>

  <!-- Session 1 -->
  <rect x="60" y="180" width="720" height="590" rx="24" fill="url(#session1Grad)" stroke="#B9D9EA" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="108" cy="230" r="25" fill="#176B87"/>
  <text x="108" y="237" text-anchor="middle" style="font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF;">1</text>
  <text x="150" y="227" class="sectionTitle">Sesión 1 · Arquitecturas distribuidas</text>
  <text x="150" y="255" class="sectionSub">Arquitectura = límites + comunicación</text>

  <!-- Architecture styles -->
  <text x="95" y="307" class="cardTitle">Estilos principales</text>

  <g transform="translate(95 330)">
    <rect x="0" y="0" width="202" height="78" rx="14" fill="#FFFFFF" stroke="#C7DDE9"/>
    <circle cx="28" cy="27" r="11" fill="#176B87"/>
    <rect x="53" y="17" width="18" height="18" rx="4" fill="#8CBFD3"/>
    <line x1="39" y1="27" x2="53" y2="27" stroke="#176B87" stroke-width="3"/>
    <text x="18" y="55" class="chip">Client–Server</text>
    <text x="18" y="71" class="small">autoridad central</text>

    <rect x="222" y="0" width="202" height="78" rx="14" fill="#FFFFFF" stroke="#C7DDE9"/>
    <circle cx="250" cy="27" r="9" fill="#176B87"/>
    <circle cx="284" cy="27" r="9" fill="#176B87"/>
    <circle cx="267" cy="50" r="9" fill="#8CBFD3"/>
    <line x1="258" y1="31" x2="263" y2="43" stroke="#176B87" stroke-width="2"/>
    <line x1="276" y1="31" x2="271" y2="43" stroke="#176B87" stroke-width="2"/>
    <line x1="259" y1="27" x2="275" y2="27" stroke="#176B87" stroke-width="2"/>
    <text x="240" y="55" class="chip">Peer-to-Peer</text>
    <text x="240" y="71" class="small">nodos equivalentes</text>

    <rect x="444" y="0" width="202" height="78" rx="14" fill="#FFFFFF" stroke="#C7DDE9"/>
    <rect x="461" y="14" width="47" height="9" rx="4" fill="#176B87"/>
    <rect x="461" y="28" width="47" height="9" rx="4" fill="#579AB5"/>
    <rect x="461" y="42" width="47" height="9" rx="4" fill="#8CBFD3"/>
    <text x="525" y="32" class="chip">Layered / N-tier</text>
    <text x="525" y="50" class="small">presentación · lógica · datos</text>

    <rect x="0" y="96" width="202" height="78" rx="14" fill="#FFFFFF" stroke="#C7DDE9"/>
    <rect x="18" y="111" width="54" height="12" rx="6" fill="#176B87"/>
    <rect x="18" y="134" width="54" height="12" rx="6" fill="#8CBFD3"/>
    <line x1="45" y1="123" x2="45" y2="134" stroke="#176B87" stroke-width="3"/>
    <text x="88" y="127" class="chip">SOA</text>
    <text x="88" y="146" style="font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#475569;">servicios + ESB/bus</text>

    <rect x="222" y="96" width="202" height="78" rx="14" fill="#FFFFFF" stroke="#C7DDE9"/>
    <rect x="239" y="112" width="27" height="27" rx="6" fill="#176B87"/>
    <rect x="273" y="112" width="27" height="27" rx="6" fill="#579AB5"/>
    <rect x="307" y="112" width="27" height="27" rx="6" fill="#8CBFD3"/>
    <text x="346" y="127" class="chip">Microservices</text>
    <text x="346" y="146" style="font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#475569;">capacidad + datos propios</text>

    <rect x="444" y="96" width="202" height="78" rx="14" fill="#FFFFFF" stroke="#C7DDE9"/>
    <circle cx="469" cy="126" r="12" fill="#176B87"/>
    <circle cx="505" cy="112" r="8" fill="#8CBFD3"/>
    <circle cx="505" cy="141" r="8" fill="#8CBFD3"/>
    <line x1="480" y1="122" x2="497" y2="114" stroke="#176B87" stroke-width="2"/>
    <line x1="480" y1="130" x2="497" y2="139" stroke="#176B87" stroke-width="2"/>
    <text x="525" y="127" class="chip">Event-driven</text>
    <text x="525" y="146" class="small">eventos asíncronos</text>
  </g>

  <!-- Core rules session 1 -->
  <rect x="95" y="530" width="650" height="104" rx="16" fill="#FFFFFF" stroke="#C7DDE9"/>
  <text x="118" y="558" class="cardTitle">Microservicios: frontera por capacidad de negocio</text>
  <text x="118" y="584" class="body">Bounded Context (DDD) · datos propios · contratos REST / gRPC / eventos</text>
  <text x="118" y="610" class="body">Beneficio: despliegue y escalamiento independiente.</text>

  <rect x="95" y="651" width="650" height="88" rx="16" fill="#FFF7E8" stroke="#E8C57A"/>
  <text x="118" y="680" class="cardTitle">Trade-off y antipatrón</text>
  <text x="118" y="705" class="body">Independencia de desarrollo &lt;--&gt; complejidad operacional</text>
  <text x="118" y="728" class="small">Evitar: servicios con BD compartida + despliegue conjunto = monolito distribuido.</text>

  <!-- Session 2 -->
  <rect x="820" y="180" width="720" height="590" rx="24" fill="url(#session2Grad)" stroke="#B9DEC9" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="868" cy="230" r="25" fill="#278B63"/>
  <text x="868" y="237" text-anchor="middle" style="font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF;">2</text>
  <text x="910" y="227" class="sectionTitle">Sesión 2 · Planning arquitectónico</text>
  <text x="910" y="255" class="sectionSub">Convertir aprendizaje en decisiones y trabajo ejecutable</text>

  <!-- Flow -->
  <text x="855" y="307" class="cardTitle">Flujo de planificación</text>
  <g>
    <rect x="855" y="330" width="130" height="58" rx="14" fill="#278B63"/>
    <text x="920" y="354" text-anchor="middle" class="flowTitle">1. Refinar</text>
    <text x="920" y="375" text-anchor="middle" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#DDF5EA;">backlog</text>

    <line x1="985" y1="359" x2="1015" y2="359" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1025" y="330" width="130" height="58" rx="14" fill="#278B63"/>
    <text x="1090" y="354" text-anchor="middle" class="flowTitle">2. Decidir</text>
    <text x="1090" y="375" text-anchor="middle" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#DDF5EA;">límites + contratos</text>

    <line x1="1155" y1="359" x2="1185" y2="359" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1195" y="330" width="130" height="58" rx="14" fill="#278B63"/>
    <text x="1260" y="354" text-anchor="middle" class="flowTitle">3. Registrar</text>
    <text x="1260" y="375" text-anchor="middle" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#DDF5EA;">ADR</text>

    <line x1="1325" y1="359" x2="1355" y2="359" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1365" y="330" width="130" height="58" rx="14" fill="#278B63"/>
    <text x="1430" y="354" text-anchor="middle" class="flowTitle">4. Dividir</text>
    <text x="1430" y="375" text-anchor="middle" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#DDF5EA;">historias + AC</text>
  </g>

  <!-- Context map -->
  <rect x="855" y="420" width="312" height="167" rx="16" fill="#FFFFFF" stroke="#C8E0D2"/>
  <text x="878" y="450" class="cardTitle">Context Map primero</text>
  <text x="878" y="475" class="body">• lenguaje de negocio</text>
  <text x="878" y="499" class="body">• reglas propias</text>
  <text x="878" y="523" class="body">• propiedad de datos</text>
  <text x="878" y="547" class="body">• relaciones entre contextos</text>
  <text x="878" y="573" class="small">Las fronteras de servicios siguen estas líneas.</text>

  <!-- ADR -->
  <rect x="1185" y="420" width="310" height="167" rx="16" fill="#FFFFFF" stroke="#C8E0D2"/>
  <text x="1208" y="450" class="cardTitle">ADR-001</text>
  <text x="1208" y="478" class="body">Contexto: <tspan class="small">fuerzas y restricciones</tspan></text>
  <text x="1208" y="503" class="body">Decisión: <tspan class="small">qué se elige</tspan></text>
  <text x="1208" y="528" class="body">Alternativas: <tspan class="small">rechazadas + motivo</tspan></text>
  <text x="1208" y="553" class="body">Consecuencias: <tspan class="small">beneficios + costos</tspan></text>
  <text x="1208" y="578" style="font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#475569;">Cambio posterior → nuevo ADR que sustituye al anterior.</text>

  <!-- Decision rule -->
  <rect x="855" y="607" width="640" height="132" rx="16" fill="#EFF9F4" stroke="#8CC7AA"/>
  <text x="878" y="638" class="cardTitle">Regla para extraer un microservicio</text>
  <rect x="878" y="657" width="180" height="46" rx="12" fill="#FFFFFF" stroke="#8CC7AA"/>
  <text x="968" y="686" text-anchor="middle" class="chip">Frontera real</text>
  <text x="1080" y="686" style="font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#278B63;">+</text>
  <rect x="1105" y="657" width="250" height="46" rx="12" fill="#FFFFFF" stroke="#8CC7AA"/>
  <text x="1230" y="686" text-anchor="middle" class="chip">Necesidad real de escala/deploy</text>
  <text x="1378" y="686" style="font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#278B63;">→</text>
  <rect x="1402" y="657" width="72" height="46" rx="12" fill="#278B63"/>
  <text x="1438" y="686" text-anchor="middle" style="font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF;">Extraer</text>
  <text x="878" y="724" class="small">Sin ambas condiciones: preferir un monolito modular bien diseñado.</text>

  <!-- Combined learning flow -->
  <rect x="60" y="805" width="1480" height="150" rx="24" fill="#FFFFFF" stroke="#D5DEE7" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="842" text-anchor="middle" class="sectionTitle">Resumen integrado de las dos clases</text>

  <g transform="translate(105 867)">
    <rect x="0" y="0" width="205" height="52" rx="14" fill="#176B87"/>
    <text x="102.5" y="32" text-anchor="middle" class="flowTitle">Entender el dominio</text>

    <line x1="205" y1="26" x2="253" y2="26" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="265" y="0" width="205" height="52" rx="14" fill="#176B87"/>
    <text x="367.5" y="32" text-anchor="middle" class="flowTitle">Definir fronteras</text>

    <line x1="470" y1="26" x2="518" y2="26" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="530" y="0" width="205" height="52" rx="14" fill="#4E869F"/>
    <text x="632.5" y="32" text-anchor="middle" class="flowTitle">Comparar estilos</text>

    <line x1="735" y1="26" x2="783" y2="26" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="795" y="0" width="205" height="52" rx="14" fill="#278B63"/>
    <text x="897.5" y="32" text-anchor="middle" class="flowTitle">Tomar decisión</text>

    <line x1="1000" y1="26" x2="1048" y2="26" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1060" y="0" width="205" height="52" rx="14" fill="#278B63"/>
    <text x="1162.5" y="32" text-anchor="middle" class="flowTitle">Documentar ADR</text>

    <line x1="1265" y1="26" x2="1313" y2="26" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1325" y="0" width="105" height="52" rx="14" fill="#0F5132"/>
    <text x="1377.5" y="32" text-anchor="middle" class="flowTitle">Backlog</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="985" width="1600" height="65" fill="#123B5D"/>
  <text x="80" y="1017" class="footerTitle">Principio clave: dividir por una razón, no por moda.</text>
  <text x="80" y="1040" class="footerBody">Una buena arquitectura hace explícitos los límites, contratos, trade-offs y motivos de la decisión.</text>
  <text x="1515" y="1028" text-anchor="end" style="font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#B9CEDD;">Fuente: OVA CORHUILA · Semana 2 · Sesiones 1–2</text>
</svg>